name: Deploy to Server

on:
  push:
    branches:
      - v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/crypto_trading_app:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/crypto_trading_app:latest

    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/user/crypto_trading_platform


          echo "🟢 Применяем миграции --------"
          docker exec -it postgres_db psql -U ${{ secrets.DB_USERNAME }} -d trading_db
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;
          docker exec -it crypto_trading_app rm -rf migrations
          docker exec -it crypto_trading_app aerich init -t app.database.TORTOISE_ORM
          docker exec -it crypto_trading_app aerich init-db
          docker exec -it crypto_trading_app aerich migrate
          docker exec -it crypto_trading_app aerich upgrade
          docker exec -it postgres_db psql -U postgres -d trading_db -c "\dt"


          echo "🧼 Truncating DB tables (кроме bots_info)..."
          docker exec -i postgres_db psql -U ${{ secrets.DB_USERNAME }} -d trading_db << EOF
          SET session_replication_role = 'replica';
          DO \$\$
          DECLARE 
              r RECORD;
          BEGIN
              FOR r IN (
                  SELECT tablename 
                  FROM pg_tables 
                  WHERE schemaname = 'public' 
                    AND tablename <> 'bots_nfo'
              )
              LOOP
                  EXECUTE 'TRUNCATE TABLE public.' || quote_ident(r.tablename) || ' RESTART IDENTITY CASCADE';
              END LOOP;
          END \$\$;
          SET session_replication_role = 'origin';

          -- 🟢 Заполняем таблицу bots_info
          INSERT INTO bots_info (name, type, pnl, crypto_pairs, description, scale_for_backtest ,created_at, updated_at)
          VALUES 
            ('E0V1E', 'FUTURE', 160, 'BTC/USDT', 'Данный бот круто торгует на BTC', 1.0 ,CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
            ('BB_RTR', 'SPOT', 100500, 'MANY', 'Не скам зуб даю', CURRENT_TIMESTAMP, 0.2, CURRENT_TIMESTAMP),
            ('every_minute', 'SPOT', 70, 'BTC/USDT', 'Данный бот хорошо торгует на BTC', 1.0, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

          DO \$\$ BEGIN
              RAISE NOTICE 'Таблицы очищены, bots_info заполнена.';
          END \$\$;
          EOF

          echo "♻️ Cleaning up...."
          docker rm -f $(docker ps -aq)
          rm -rf user_data/user_1

          echo "📦 Updating repo..."
          git reset --hard
          git clean -fdX
          git restore .
          git pull

          echo "🚀 Starting containers..."
          docker-compose down
          docker-compose up -d --build

          echo "📊 Importing backtests..."
          docker-compose run --rm app python3 -m app.load_backtests

          echo "⌛ Ожидаем 10 секунд..."
          sleep 10

          rm ./letsencrypt/acme.json
          touch ./letsencrypt/acme.json
          chmod 600 ./letsencrypt/acme.json
          docker stop traefik_proxy
          sleep 2
          docker run --rm -v "$(pwd)/letsencrypt:/letsencrypt" alpine ls -l /letsencrypt/acme.json
          docker-compose up -d traefik


